# Ghostty — first surface opens herdr in the toolbox; additional tabs/windows
# open a plain toolbox shell (herdr clients mirror whole sessions, so a second
# herdr attach would just duplicate the same picture). Logic lives in the
# wrapper script; edit it to change the behavior:
#   ~/.local/bin/ghostty-tab-shell
command = /var/home/Louranicas/.local/bin/ghostty-tab-shell
# Alternatives:
# command = /usr/bin/toolbox run herdr      # every surface attaches herdr
# command = /usr/bin/toolbox enter          # every surface is a plain toolbox shell

# Always show the tab bar, even with a single tab (default "auto" hides it
# until a second tab exists — looked like tabs were broken).
window-show-tab-bar = always

theme = Builtin Dark
window-padding-x = 8
window-padding-y = 8
